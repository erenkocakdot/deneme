<script>
const $=s=>document.querySelector(s),f0=x=>Math.round(x),f1=x=>(Math.round(x*10)/10);
window.alert=m=>{const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',4000)};
const KEY='fit_v1';
const A=[['Yürüyüş',3.5],['Koşu',9.8],['Bisiklet',7.5],['Yüzme',6],['Ağırlık antrenmanı',5],['HIIT',8],['Futbol',7],['Yoga',2.5]];

const G={lose:['Kilo ver (−450 kcal/gün)',-450],keep:['Kilomu koru',0],gain:['Kilo al (+350 kcal/gün)',350]};
const ACT=[[1.2,'Az hareketli (masa başı)'],[1.35,'Hafif hareketli'],[1.5,'Aktif (gün boyu ayakta)']];
const ML=['Kahvaltı','Öğle','Akşam','Atıştırmalık'],DN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const nz=s=>s.toLocaleLowerCase('tr').replace(/[çğıöşü]/g,c=>({ç:'c',ğ:'g',ı:'i',ö:'o',ş:'s',ü:'u'})[c]);
const DB=[['Yumurta','yumurta|omlet',155,13,1.1,11,50,50],['Menemen','menemen',110,6,5,8,0,200],['Ekmek','ekmek',265,9,49,3.2,30,60],['Tam buğday ekmek','tam bugday|tam tahil|kepek',250,10,43,4,30,60],['Simit','simit',330,10,58,6,120,120],['Poğaça','pogaca',400,9,40,23,90,90],['Börek','borek',300,9,28,17,0,150],['Tost','tost',270,12,28,11,120,120],['Sandviç','sandvic',250,10,30,9,150,150],['Beyaz peynir','beyaz peynir|peynir',264,17,1.5,21,30,30],['Kaşar','kasar',350,25,1,28,25,25],['Zeytin','zeytin',145,1,4,15,4,30],['Bal','bal',304,.3,82,0,20,20],['Reçel','recel',250,.4,65,0,20,20],['Tereyağı','tereyag',717,.9,.1,81,10,10],['Zeytinyağı','zeytinyag|sivi yag',884,0,0,100,15,15],['Yoğurt','yogurt',61,3.5,4.7,3.3,0,200],['Ayran','ayran',40,2,3,2,0,200],['Süt','sut',61,3.2,4.8,3.3,0,200],['Tavuk göğsü','tavuk gogsu|tavuk|pilic',165,31,0,3.6,0,150],['Tavuk but','tavuk but|but',209,26,0,11,0,150],['Kırmızı et','et|dana|biftek|bonfile',250,26,0,17,0,150],['Kıyma','kiyma',250,17,0,20,0,100],['Köfte','kofte',250,17,6,18,25,100],['Kebap','kebap|adana|urfa',230,20,2,16,0,150],['Döner','doner',217,18,3,15,0,150],['Döner dürüm','durum|doner durum',250,13,23,11,0,220],['İskender','iskender',200,13,12,11,0,300],['Lahmacun','lahmacun',230,10,30,8,120,120],['Pide','pide',270,11,35,9,0,250],['Pizza','pizza',266,11,33,10,110,250],['Hamburger','hamburger|burger',250,13,24,11,0,220],['Mantı','manti',200,8,28,6,0,200],['Sarma','sarma|dolma',150,3,18,7,25,150],['Patlıcan yemeği','karniyarik|musakka|patlican',110,4,8,7,0,250],['Sebze yemeği','sebze|zeytinyagli|taze fasulye|ispanak|bamya|kabak',90,2,9,5,0,200],['Kuru fasulye','kuru fasulye|fasulye|barbunya',120,7,17,2.5,0,200],['Nohut yemeği','nohut',140,7,20,3.5,0,200],['Mercimek çorbası','mercimek|corba',55,3,8,1.5,0,250],['Makarna','makarna|spagetti|eriste',158,6,31,1,0,200],['Pilav','pilav|pirinc',150,2.7,28,2.5,0,150],['Bulgur pilavı','bulgur',115,4,22,.5,0,150],['Patates','patates',87,2,20,.1,0,150],['Patates kızartması','patates kizartmasi|kizartma',312,3.4,41,15,0,150],['Salata','salata',35,1.5,5,1.2,0,150],['Domates','domates',18,.9,3.9,.2,120,120],['Salatalık','salatalik|hiyar',15,.7,3.6,.1,150,150],['Avokado','avokado',160,2,9,15,150,150],['Somon','somon',208,20,0,13,0,150],['Balık','balik|levrek|cupra|hamsi',150,22,0,6,0,150],['Ton balığı','ton balik|ton',116,26,0,1,0,80],['Muz','muz',89,1.1,23,.3,120,120],['Elma','elma',52,.3,14,.2,180,180],['Portakal','portakal',47,.9,12,.1,200,200],['Mandalina','mandalina',53,.8,13,.3,80,160],['Armut','armut',57,.4,15,.1,180,180],['Kivi','kivi',61,1.1,15,.5,75,150],['Üzüm','uzum',69,.7,18,.2,5,100],['Çilek','cilek',32,.7,8,.3,15,150],['Karpuz','karpuz',30,.6,8,.2,0,300],['Fındık','findik',628,15,17,61,2,30],['Ceviz','ceviz',654,15,14,65,5,30],['Badem','badem',579,21,22,50,1.2,30],['Yer fıstığı','yer fistigi|fistik',567,26,16,49,1,30],['Fıstık ezmesi','fistik ezmesi',588,25,20,50,15,30],['Tahin','tahin',595,17,21,54,15,15],['Pekmez','pekmez',290,1,72,0,15,20],['Yulaf','yulaf',380,13,66,7,0,50],['Granola','granola|musli',450,10,64,17,0,40],['Mısır gevreği','gevrek|misir gevregi',370,7,84,1,0,40],['Çikolata','cikolata',540,6,60,31,5,30],['Bisküvi','biskuvi|gofret',450,7,70,15,8,30],['Kek','kek',400,5,55,18,0,70],['Baklava','baklava',430,6,50,24,40,100],['Sütlaç','sutlac',130,3.5,22,3,0,150],['Dondurma','dondurma',207,3.5,24,11,50,100],['Tatlı','tatli|pasta',350,4,50,15,0,100],['Cips','cips',536,6,53,34,0,30],['Kola','kola|cola|gazli icecek|fanta|sprite',42,0,10.6,0,0,330],['Meyve suyu','meyve suyu',46,.5,11,0,0,200],['Çay','cay',1,0,0,0,0,100],['Kahve','kahve',2,.1,0,0,0,60],['Latte','latte|cappuccino|kapucino',48,3,4.5,2,0,250],['Şeker','seker',387,0,100,0,5,5],['Whey protein','whey|protein tozu|protein',400,80,8,6,30,30],['Protein bar','protein bar',380,30,35,12,50,50],['Sucuk','sucuk',450,20,2,40,10,50],['Sosis','sosis',300,12,3,27,40,80],['Humus','humus',170,8,14,10,0,60]].map(e=>({n:e[0],kw:e[1].split('|'),k:e[2],p:e[3],c:e[4],f:e[5],a:e[6]||e[7],por:e[7]}));
const NUM={yarim:.5,iki:2,uc:3,dort:4,bes:5},U='cay kasigi|yemek kasigi|kasik|gram|gr|kg|g|ml|litre|lt|l|adet|dilim|kase|bardak|porsiyon|tabak|olcek|kutu|top|avuc';
function est1(raw){const s=nz(raw).replace(/\b(yarim|iki|uc|dort|bes)\b/g,x=>NUM[x]);let b=null,bl=0;
 DB.forEach(e=>e.kw.forEach(k=>{if(k.length>bl&&new RegExp('(^|[^a-z])'+k).test(s)){b=e;bl=k.length}}));if(!b)return null;
 const m=s.match(new RegExp('(\\d+(?:[.,]\\d+)?)\\s*('+U+')?(?![a-z])')),n=m?+m[1].replace(',','.'):1,u=m&&m[2],a=b.a||b.por;let g;
 if(!m)g=b.por;else if(!u)g=n>=30?n:n*a;else g=({g:n,gr:n,gram:n,kg:n*1000,ml:n,l:n*1000,lt:n*1000,litre:n*1000,adet:n*a,dilim:n*a,kase:n*b.por,bardak:n*200,porsiyon:n*b.por,tabak:n*b.por*1.5,kasik:n*15,'yemek kasigi':n*15,'cay kasigi':n*5,olcek:n*30,kutu:n*330,top:n*50,avuc:n*30})[u];
 return{e:b,g,k:b.k*g/100,p:b.p*g/100,c:b.c*g/100,f:b.f*g/100}}
function estimate(t){const cu=S.cu||{},add=(r,x)=>['k','p','c','f'].forEach(i=>r[i]+=x[i]),r={k:0,p:0,c:0,f:0},ok=[],bad=[];
 if(cu[nz(t.trim())]){add(r,cu[nz(t.trim())]);return{...r,ok:['kayıtlı değerin'],bad}}
 t.split(/\s*(?:\+|,|\bve\b|\bile\b)\s*/i).filter(x=>x.trim()).forEach(x=>{const c=cu[nz(x.trim())];if(c){add(r,c);ok.push(x.trim()+' (kayıtlı)');return}const e=est1(x);if(e){add(r,e);ok.push(e.e.n+' '+f0(e.g)+' g')}else bad.push(x.trim())});
 return ok.length?{...r,ok,bad}:null}
const def=()=>({p:{age:23,sex:'m',h:175,w:75,act:1.35,goal:'keep',diet:'bal'},food:[],work:[],wt:[],cu:{},tasks:[]});
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||def()}catch(e){return def()}})();
S.cu=S.cu||{};S.tasks=S.tasks||[];
function toDocs(){const o={profile:{p:S.p,cu:S.cu},tasks:{list:S.tasks}};new Set([...S.food,...S.work,...S.wt].map(x=>x.d)).forEach(d=>o['d_'+d]={food:S.food.filter(x=>x.d==d),work:S.work.filter(x=>x.d==d),wt:S.wt.find(x=>x.d==d)||null});return o}
let wtm;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(DBC){clearTimeout(wtm);wtm=setTimeout(dbSync,400)}};
async function dbSync(){const o=toDocs();try{for(const k in o){const j=JSON.stringify(o[k]);if(CACHE[k]!==j){await DBC.doc(k).set(JSON.parse(j));CACHE[k]=j}}for(const k in CACHE)if(!(k in o)){await DBC.doc(k).delete();delete CACHE[k]}ST='db'}catch(e){ST='err';alert('Veritabanına kaydedilemedi, veri bu tarayıcıda duruyor.')}}
const iso=d=>d.toLocaleDateString('sv'),dd=s=>new Date(s+'T12:00'),add=(s,n)=>{const d=dd(s);d.setDate(d.getDate()+n);return iso(d)};
let cur=iso(new Date()),tab='today',uid=()=>Date.now()+Math.random();
function curW(d){const w=S.wt.filter(x=>x.d<=d).sort((a,b)=>a.d<b.d?1:-1)[0];return w?w.kg:S.p.w}
function T(d){const p=S.p,w=curW(d),bmr=10*w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161),base=bmr*p.act,target=Math.max(base+G[p.goal][1],1200),m=D[p.diet];
 return{w,bmr,base,target,adj:G[p.goal][1],mac:{p:target*m[1]/400,c:target*m[2]/400,f:target*m[3]/900}}}
function day(d){const F=S.food.filter(x=>x.d==d),W=S.work.filter(x=>x.d==d),s=k=>F.reduce((a,x)=>a+x[k],0);
 return{F,W,n:F.length,k:s('k'),p:s('p'),c:s('c'),f:s('f'),ex:W.reduce((a,x)=>a+x.k,0),min:W.reduce((a,x)=>a+x.m,0)}}
function pbar(v,mx,col){return`<div class="bar"><i style="width:${Math.min(100,v/mx*100||0)}%;background:${col}"></i></div>`}
function nav(){$('#nv').innerHTML=[['today','Bugün'],['task','Görevler'],['an','Analiz'],['set','Ayarlar'],['data','Veri']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';R()">${t[1]}</button>`).join('')}
function R(){man=0;$('#dt').value=cur;nav();$('#v').innerHTML=({today:vToday,task:vTask,an:vAn,set:vSet,data:vData})[tab]()}
function opts(arr,sel,fn){return arr.map((x,i)=>{const [v,l]=fn(x,i);return`<option value="${v}"${v==sel?' selected':''}>${l}</option>`}).join('')}

function vToday(){const t=T(cur),d=day(cur),left=t.target+d.ex-d.k,pc=d.k/(t.target+d.ex)*100;
 const mb=(n,v,m,c)=>`<div class="m">${n}: ${f0(v)} / ${f0(m)} g</div>${pbar(v,m,c)}`;
 return`<div class="c" id="tb">${tBanner()}</div><div class="g"><div class="c"><h2>Kalori</h2><div class="big">${f0(d.k)} <span class="m">/ ${f0(t.target)} kcal</span></div>${pbar(d.k,t.target+d.ex,pc>110?'var(--r)':'var(--a)')}
 <div class="m">${left>=0?`Kalan: <b>${f0(left)}</b> kcal`:`<b style="color:var(--r)">${f0(-left)} kcal fazla</b>`} (spor dahil) · Spor: ${f0(d.ex)} kcal</div></div>
 <div class="c"><h2>Makrolar · ${D[S.p.diet][0]}</h2>${mb('Protein',d.p,t.mac.p,'var(--b)')}${mb('Karbonhidrat',d.c,t.mac.c,'var(--y)')}${mb('Yağ',d.f,t.mac.f,'var(--r)')}</div></div>
 <div class="c"><h2>Yemek ekle</h2><div class="row"><label>Öğün<select id="fm">${opts(ML,0,x=>[x,x])}</select></label>
 <label style="flex:3">Yemek<input id="fn" list="fl" oninput="fillF(1)" placeholder="Örn: 2 yumurta + 1 dilim ekmek, tavuk 200 g"></label><datalist id="fl">${DB.map(x=>`<option value="${x.n}">`).join('')}</datalist>
 <label>Çarpan<input id="fq" type="number" step="0.25" value="1" oninput="fillF(1)"></label></div>
 <div class="m" id="fh" style="min-height:20px;margin-bottom:6px"></div>
 <div id="fr" class="m"></div>
 <div class="row"><button class="b s" onclick="offSearch()">Yemek veritabanında ara</button></div>
 <div class="row ${AI?'':'hide'}"><button class="b s" onclick="aiText()">AI ile hesapla</button><label class="${AIimg?'':'hide'}" style="flex:none;flex-direction:row;font-size:15px;cursor:pointer;padding:7px 9px;border:1px solid var(--ln);border-radius:7px;color:var(--tx)">Fotoğraf çek / seç<input type="file" accept="image/*" class="hide" onchange="aiPhoto(this)"></label></div>
 <div class="row"><label>kcal<input id="fk" type="number" oninput="man=1"></label><label>Protein g<input id="fp" type="number" step="0.1" oninput="man=1"></label><label>Karb. g<input id="fc" type="number" step="0.1" oninput="man=1"></label><label>Yağ g<input id="ff" type="number" step="0.1" oninput="man=1"></label><button class="b" onclick="addF()">Ekle</button></div>
 ${d.n?`<div class="sc"><table class="ed"><tr><th>Öğün</th><th>Yemek</th><th>kcal</th><th>P</th><th>K</th><th>Y</th><th></th></tr>${ML.flatMap(m=>d.F.filter(x=>x.m==m)).map(x=>`<tr><td><select onchange="upd('food','${x.id}','m',this.value)">${opts(ML,x.m,y=>[y,y])}</select></td><td><input class="t" value="${esc(x.n)}" onchange="upd('food','${x.id}','n',this.value)"></td>${['k','p','c','f'].map(q=>`<td><input type="number" step="0.1" value="${f1(x[q])}" onchange="upd('food','${x.id}','${q}',this.value)"></td>`).join('')}<td class="x"><button onclick="del('food','${x.id}')">×</button></td></tr>`).join('')}</table></div><p class="m">Satırlardaki yemek adı ve değerleri doğrudan değiştirebilirsin.</p>`:'<p class="m">Bu gün için yemek kaydı yok.</p>'}</div>

 ${d.W.length?`<table class="ed">${d.W.map(x=>`<tr><td>${x.t}</td><td><input type="number" value="${x.m}" onchange="upd('work','${x.id}','m',this.value)"> dk</td><td><input type="number" value="${f0(x.k)}" onchange="upd('work','${x.id}','k',this.value)"> kcal</td><td class="x"><button onclick="del('work','${x.id}')">×</button></td></tr>`).join('')}</table>`:'<p class="m">Spor kaydı yok. Kalori, kilona ve sporun yoğunluğuna göre hesaplanır.</p>'}</div>
 <div class="c"><h2>Kilo</h2><div class="row"><label>Kilo (kg)<input id="wv" type="number" step="0.1" value="${t.w}"></label><button class="b" onclick="addWt()">Kaydet</button></div><p class="m">Seçili tarih için kilo kaydeder; hedefler en son kiloya göre güncellenir.</p></div></div>`}

 return`<h2>Görevler <button class="b s" style="float:right;padding:3px 10px" onclick="tab='task';R()">Aç</button></h2>`+(all.length?`<div class="m">Bugün ${dn.length}/${all.length} görev tamamlandı · ${f1(hs(dn))}/${f1(hs(all))} saat</div>`:'<div class="m">Bugün için görev yok.</div>')+(L.length?'<div class="m" style="margin-top:6px">Yakında yapman gerekenler:</div>':'')+L.map(t=>{const i=tinfo(t);return`<div class="tk"><input type="checkbox" onchange="tg('${t.id}')"><span style="flex:1"><b>${t.tm}</b> ${hx(t.t)} <span class="m">(${t.h} sa)</span></span><span style="color:${i[1]}">${i[0]}</span></div>`}).join('')}
function vTask(){const by=a=>a.sort((x,y)=>(x.d+x.tm)>(y.d+y.tm)?1:-1),dy=by(S.tasks.filter(t=>t.d==cur)),up=by(S.tasks.filter(t=>t.d>cur&&!t.done)),late=by(S.tasks.filter(t=>t.d<cur&&!t.done)),old=by(S.tasks.filter(t=>t.d<cur&&t.done)).slice(-10),sm=a=>a.reduce((x,t)=>x+(+t.h||0),0);
 const tb=(a,e)=>a.length?`<table>${a.map(t=>{const i=tinfo(t);return`<tr><td style="width:28px"><input type="checkbox" ${t.done?'checked':''} onchange="tg('${t.id}')"></td><td>${a===dy?'':t.d.slice(5).split('-').reverse().join('.')+' '}${t.tm}–${tEnd(t).toTimeString().slice(0,5)}</td><td${t.done?' style="text-decoration:line-through;color:var(--mu)"':''}>${hx(t.t)}</td><td>${t.h} sa</td><td style="color:${i[1]}">${i[0]}</td><td class="x"><button onclick="del('tasks','${t.id}')">×</button></td></tr>`}).join('')}</table>`:`<p class="m">${e}</p>`;
 return`<div class="c"><h2>Görev ekle</h2><div class="row"><label style="flex:3">Görev<input id="tt" placeholder="Örn: Etsy listing yaz, ders, spor"></label><label>Tarih<input id="td" type="date" value="${cur}"></label><label>Saat<input id="tm" type="time" value="09:00"></label><label>Süre (saat)<input id="th" type="number" step="0.25" min="0.25" value="1"></label><button class="b" onclick="addT()">Ekle</button></div></div>
<div class="c"><h2>${cur.split('-').reverse().join('.')}</h2><div class="m">Planlı ${f1(sm(dy))} sa · yapılan ${f1(sm(dy.filter(t=>t.done)))} sa</div>${tb(dy,'Bu gün için görev yok.')}</div>${late.length?`<div class="c"><h2>Tamamlanmamış (geçmiş)</h2>${tb(late)}</div>`:''}<div class="c"><h2>Yaklaşan</h2>${tb(up,'Yaklaşan görev yok.')}</div>${old.length?`<div class="c"><h2>Son tamamlananlar</h2>${tb(old)}</div>`:''}`}
function addT(){const t=$('#tt').value.trim(),d=$('#td').value,tm=$('#tm').value||'09:00',h=+$('#th').value;if(!t||!d||!(h>0)){alert('Görev adı, tarih ve süre gerekli.');return}S.tasks.push({id:uid(),t,d,tm,h,done:0});save();R()}
function tg(id){const x=S.tasks.find(y=>y.id==id);if(!x)return;x.done=x.done?0:1;x.dn=x.done?new Date().toISOString():null;save();R()}
function rawData(){const ds=a=>a.slice().sort((x,y)=>(y.d||'')>(x.d||'')?1:-1),
 T2=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${hx(c)}</td>`).join('')}</tr>`).join('')}</table></div>`,
 B=(t,n,b)=>`<details class="c"><summary><b>${t}</b> <span class="m">(${n} kayıt)</span></summary><div style="margin-top:8px">${n?b:'<p class="m">Kayıt yok.</p>'}</div></details>`;
 return'<h2 style="margin:6px 0">Ham veri (kaydedilen her şey)</h2>'+
 B('Yemek kayıtları',S.food.length,T2(['Tarih','Öğün','Yemek','kcal','P','K','Y'],ds(S.food).map(x=>[x.d,x.m,x.n,f0(x.k),f1(x.p),f1(x.c),f1(x.f)])))+
 B('Spor kayıtları',S.work.length,T2(['Tarih','Tür','Dk','kcal'],ds(S.work).map(x=>[x.d,x.t,x.m,f0(x.k)])))+
 B('Kilo kayıtları',S.wt.length,T2(['Tarih','Kg'],ds(S.wt).map(x=>[x.d,x.kg])))+
 B('Görevler',S.tasks.length,T2(['Tarih','Saat','Süre (sa)','Görev','Durum'],ds(S.tasks).map(x=>[x.d,x.tm,x.h,x.t,x.done?'Yapıldı':'Bekliyor'])))+
 B('Kayıtlı yemeklerim',Object.keys(S.cu).length,T2(['Yazım','kcal','P','K','Y'],Object.entries(S.cu).map(([k,v])=>[k,f0(v.k),f1(v.p),f1(v.c),f1(v.f)])))+
 B('Profil ve ayarlar',1,T2(['Yaş','Cinsiyet','Boy','Kilo','Hareket','Hedef','Diyet'],[[S.p.age,S.p.sex=='m'?'Erkek':'Kadın',S.p.h,S.p.w,S.p.act,G[S.p.goal][0],D[S.p.diet][0]]]))}

  if(ph||!$('#fn').value.trim())$('#fn').value=r.ad;

 catch(e){h.textContent=e&&e.code=='not_granted'?'AI izni verilmedi.':'AI cevap veremedi, değerleri kendin gir.'}}
